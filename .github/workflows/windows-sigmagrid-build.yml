name: Sigma Grid Cloud - Windows Build

on:
  workflow_dispatch: {}

concurrency:
  group: sigmagrid-windows-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Sigma Grid Cloud for Windows
    runs-on: windows-2022

    env:
      CRAFT_TARGET: windows-msvc2022_64-cl
      CRAFT_MASTER_LOCATION: ${{ github.workspace }}\CraftMaster
      CRAFT_MASTER_CONFIG: ${{ github.workspace }}\craftmaster.ini
      PYTHON_VERSION: '3.12'

    steps:
      - name: Checkout Sigma Grid Cloud
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve Craft dependency revisions
        id: craft-revisions
        shell: pwsh
        run: |
          function configValue($key) {
              $escapedKey = [regex]::Escape($key)
              $matches = @(Select-String -Path "${{ env.CRAFT_MASTER_CONFIG }}" -Pattern "^\s*$escapedKey\s*=\s*(.+?)\s*$")
              if($matches.Count -ne 1) {
                  throw "Expected exactly one $key value in craftmaster.ini."
              }
              return $matches[0].Matches[0].Groups[1].Value.Trim()
          }

          $craftRevision = configValue "CraftRevision"
          $kdeBlueprintRef = configValue "craft/craft-blueprints-kde.revision"
          $nextcloudBlueprintRef = configValue "craft/craft-blueprints-nextcloud.revision"

          function remoteRevision($repository, $ref) {
              $revision = git ls-remote $repository $ref
              if($LASTEXITCODE -ne 0 -or !$revision) {
                  throw "Could not resolve $ref from $repository."
              }
              return ($revision -split '\s+')[0]
          }

          $kdeBlueprintRevision = remoteRevision "https://github.com/nextcloud/craft-blueprints-kde.git" "refs/heads/$kdeBlueprintRef"
          $nextcloudBlueprintRevision = remoteRevision "https://github.com/nextcloud/craft-blueprints-nextcloud.git" "refs/heads/$nextcloudBlueprintRef"

          @(
              "kde_ref=$kdeBlueprintRef"
              "nextcloud_ref=$nextcloudBlueprintRef"
              "key=$craftRevision-$kdeBlueprintRevision-$nextcloudBlueprintRevision"
          ) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore Craft dependencies
        id: craft-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.CRAFT_MASTER_LOCATION }}
            ${{ env.CRAFT_MASTER_CONFIG }}
            ${{ github.workspace }}\craft-clone
            ${{ github.workspace }}\${{ env.CRAFT_TARGET }}
          key: ${{ runner.os }}-sigmagrid-craft-v1-${{ env.CRAFT_TARGET }}-python-${{ env.PYTHON_VERSION }}-${{ steps.craft-revisions.outputs.key }}

      - name: Install Craft and Nextcloud dependencies
        if: steps.craft-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & cmd /C "git clone -q --depth=1 https://invent.kde.org/packaging/craftmaster.git ${{ env.CRAFT_MASTER_LOCATION }} 2>&1"

          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-kde.git|${{ steps.craft-revisions.outputs.kde_ref }}|"
          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-nextcloud.git|${{ steps.craft-revisions.outputs.nextcloud_ref }}|"
          craft craft
          craft --install-deps nextcloud-client

      - name: Save Craft dependencies
        if: steps.craft-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.CRAFT_MASTER_LOCATION }}
            ${{ env.CRAFT_MASTER_CONFIG }}
            ${{ github.workspace }}\craft-clone
            ${{ github.workspace }}\${{ env.CRAFT_TARGET }}
          key: ${{ runner.os }}-sigmagrid-craft-v1-${{ env.CRAFT_TARGET }}-python-${{ env.PYTHON_VERSION }}-${{ steps.craft-revisions.outputs.key }}

      - name: Install Inkscape
        shell: pwsh
        run: |
          choco install inkscape -y

      - name: Setup PATH
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Compile Sigma Grid Cloud
        shell: pwsh
        run: |
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          craft --src-dir "${{ github.workspace }}" nextcloud-client

      - name: Patch Craft for Sigma Grid Cloud packaging
        shell: pwsh
        run: |
          $blueprint = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\etc\blueprints\locations\craft-blueprints-nextcloud\nextcloud-client\nextcloud-client.py"

          $content = Get-Content $blueprint -Raw

          # Fix upstream missing Python import
          if ($content -notmatch '(?m)^import os\s*$') {
              $content = $content -replace 'import info', "import os`r`nimport info"
          }

          # Sigma Grid Cloud installer branding
          $content = $content.Replace(
              'self.description = "Nextcloud Desktop Client"',
              'self.description = "Sigma Grid Cloud Desktop Client"'
          )

          $content = $content.Replace(
              'self.displayName = "Nextcloud"',
              'self.displayName = "Sigma Grid Cloud"'
          )

          $content = $content.Replace(
              'self.webpage = "https://nextcloud.com"',
              'self.webpage = "https://sigmagrid.hr"'
          )

          $content = $content.Replace(
              'self.defines["appname"] = "nextcloud"',
              'self.defines["appname"] = "sigmagridcloud"'
          )

          $content = $content.Replace(
              'self.defines["company"] = "Nextcloud GmbH"',
              'self.defines["company"] = "Sigma Grid"'
          )

          $content = $content.Replace(
              'self.applicationExecutable = "nextcloud"',
              'self.applicationExecutable = "sigmagridcloud"'
          )

          Set-Content -Path $blueprint -Value $content -Encoding UTF8

          Write-Host "Craft blueprint patched for Sigma Grid Cloud."

      - name: Inspect Craft NSIS packaging internals
        shell: pwsh
        run: |
          Write-Host "========== CRAFT PACKAGING FILES =========="

          $roots = @(
              "${{ github.workspace }}\craft-clone",
              "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\etc"
          )

          foreach ($root in $roots) {
              if (Test-Path $root) {
                  Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue |
                    Where-Object { $_.Extension -in ".py", ".nsi", ".nsh" } |
                    Select-String -Pattern "craft\.ico|installer\.ico|MUI_ICON|MUI_WELCOMEFINISHPAGE_BITMAP|applicationExecutable|appname" -ErrorAction SilentlyContinue |
                    ForEach-Object {
                        Write-Host ""
                        Write-Host "FILE: $($_.Path)"
                        Write-Host "LINE: $($_.LineNumber)"
                        Write-Host "TEXT: $($_.Line.Trim())"
                    }
              }
          }

          Write-Host ""
          Write-Host "========== NEXTCLOUD BLUEPRINT =========="

          $blueprint = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\etc\blueprints\locations\craft-blueprints-nextcloud\nextcloud-client\nextcloud-client.py"

          if (Test-Path $blueprint) {
              Get-Content $blueprint
          }
          else {
              Write-Host "Blueprint not found: $blueprint"
          }

          Write-Host ""
          Write-Host "========== SIGMA GRID EXECUTABLE LOCATIONS =========="

          Get-ChildItem "${{ github.workspace }}\${{ env.CRAFT_TARGET }}" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {
                $_.Name -ieq "sigmagridcloud.exe" -or
                $_.Name -ieq "sigmagridcloudcmd.exe"
            } |
            ForEach-Object {
                Write-Host "$($_.FullName) [$($_.Length) bytes]"
            }

      - name: Set Sigma Grid Cloud installer icon
        shell: pwsh
        run: |
          $blueprint = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\etc\blueprints\locations\craft-blueprints-nextcloud\nextcloud-client\nextcloud-client.py"
          $icon = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\build\nextcloud-client\work\build\src\gui\SigmaGridCloud.ico"

          if (!(Test-Path $icon)) {
              throw "Sigma Grid Cloud icon not found: $icon"
          }

          $content = Get-Content $blueprint -Raw

          $old = '        self.defines["company"] = "Sigma Grid"'
          $new = '        self.defines["company"] = "Sigma Grid"' + "`r`n" +
                 '        self.defines["icon"] = r"' + $icon + '"'

          if (!$content.Contains($old)) {
              throw "Could not find Sigma Grid company definition in blueprint."
          }

          $content = $content.Replace($old, $new)

          Set-Content -Path $blueprint -Value $content -Encoding UTF8

          Write-Host "Installer icon set to:"
          Write-Host $icon

      - name: Inspect package blacklist and packaging rules
        shell: pwsh
        run: |
          Write-Host "========== BLACKLIST FILES =========="

          $blacklists = Get-ChildItem "${{ github.workspace }}\${{ env.CRAFT_TARGET }}" -Recurse -File -Filter "blacklist.txt" -ErrorAction SilentlyContinue

          if ($blacklists) {
              foreach ($file in $blacklists) {
                  Write-Host ""
                  Write-Host "BLACKLIST: $($file.FullName)"
                  Write-Host "----------------------------------------"
                  Get-Content $file.FullName
                  Write-Host "----------------------------------------"
              }
          }
          else {
              Write-Host "No blacklist.txt files found."
          }

          Write-Host ""
          Write-Host "========== PACKAGER BASE RELEVANT LINES =========="

          $packagerBase = "${{ github.workspace }}\craft-clone\bin\Packager\PackagerBase.py"

          if (Test-Path $packagerBase) {
              Select-String -Path $packagerBase `
                -Pattern "blacklist|whitelist|applicationExecutable|packageDir|imageDir|archive|createPackage" `
                -Context 5,5 |
                ForEach-Object {
                    Write-Host ""
                    Write-Host "LINE: $($_.LineNumber)"
                    Write-Host $_.ToString()
                }
          }
          else {
              Write-Host "PackagerBase.py not found."
          }

          Write-Host ""
          Write-Host "========== NSIS PACKAGER RELEVANT LINES =========="

          $nsisPackager = "${{ github.workspace }}\craft-clone\bin\Packager\NullsoftInstallerPackager.py"

          if (Test-Path $nsisPackager) {
              Select-String -Path $nsisPackager `
                -Pattern "blacklist|whitelist|applicationExecutable|appname|imageDir|packageDir|File|INSTDIR" `
                -Context 5,5 |
                ForEach-Object {
                    Write-Host ""
                    Write-Host "LINE: $($_.LineNumber)"
                    Write-Host $_.ToString()
                }
          }
          else {
              Write-Host "NullsoftInstallerPackager.py not found."
          }

          Write-Host ""
          Write-Host "========== PACKAGE IMAGE BIN =========="

          $imageBin = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\build\nextcloud-client\image-RelWithDebInfo-master\bin"

          if (Test-Path $imageBin) {
              Get-ChildItem $imageBin -File |
                Sort-Object Name |
                ForEach-Object {
                    Write-Host "$($_.Name) [$($_.Length) bytes]"
                }
          }
          else {
              Write-Host "Package image bin not found: $imageBin"
          }

      - name: Create Windows installer
        shell: pwsh
        run: |
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          craft --package nextcloud-client

      - name: Find generated installer
        shell: pwsh
        run: |
          Write-Host "Generated installer files:"

          Get-ChildItem "${{ github.workspace }}\${{ env.CRAFT_TARGET }}" -Recurse -File |
            Where-Object { $_.Extension -in ".exe", ".msi" } |
            Select-Object FullName, Length

      - name: Upload Sigma Grid Cloud installer
        uses: actions/upload-artifact@v4
        with:
          name: SigmaGridCloud-Windows
          path: |
            ${{ github.workspace }}\${{ env.CRAFT_TARGET }}\tmp\*.exe
            ${{ github.workspace }}\${{ env.CRAFT_TARGET }}\tmp\*.msi
          if-no-files-found: error
          retention-days: 14
