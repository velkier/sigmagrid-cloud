name: Sigma Grid Cloud - Windows Build

on:
  workflow_dispatch: {}

concurrency:
  group: sigmagrid-windows-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Sigma Grid Cloud for Windows
    runs-on: windows-2022

    env:
      CRAFT_TARGET: windows-msvc2022_64-cl
      CRAFT_MASTER_LOCATION: ${{ github.workspace }}\CraftMaster
      CRAFT_MASTER_CONFIG: ${{ github.workspace }}\craftmaster.ini
      PYTHON_VERSION: '3.12'

    steps:

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------

      - name: Checkout Sigma Grid Cloud
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ------------------------------------------------------------
      # CRAFT
      # ------------------------------------------------------------

      - name: Resolve Craft dependency revisions
        id: craft-revisions
        shell: pwsh
        run: |
          function configValue($key) {
              $escapedKey = [regex]::Escape($key)
              $matches = @(Select-String -Path "${{ env.CRAFT_MASTER_CONFIG }}" -Pattern "^\s*$escapedKey\s*=\s*(.+?)\s*$")

              if($matches.Count -ne 1) {
                  throw "Expected exactly one $key value in craftmaster.ini."
              }

              return $matches[0].Matches[0].Groups[1].Value.Trim()
          }

          $craftRevision = configValue "CraftRevision"
          $kdeBlueprintRef = configValue "craft/craft-blueprints-kde.revision"
          $nextcloudBlueprintRef = configValue "craft/craft-blueprints-nextcloud.revision"

          function remoteRevision($repository, $ref) {
              $revision = git ls-remote $repository $ref

              if($LASTEXITCODE -ne 0 -or !$revision) {
                  throw "Could not resolve $ref from $repository."
              }

              return ($revision -split '\s+')[0]
          }

          $kdeBlueprintRevision = remoteRevision `
              "https://github.com/nextcloud/craft-blueprints-kde.git" `
              "refs/heads/$kdeBlueprintRef"

          $nextcloudBlueprintRevision = remoteRevision `
              "https://github.com/nextcloud/craft-blueprints-nextcloud.git" `
              "refs/heads/$nextcloudBlueprintRef"

          @(
              "kde_ref=$kdeBlueprintRef"
              "nextcloud_ref=$nextcloudBlueprintRef"
              "key=$craftRevision-$kdeBlueprintRevision-$nextcloudBlueprintRevision"
          ) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore Craft dependencies
        id: craft-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.CRAFT_MASTER_LOCATION }}
            ${{ env.CRAFT_MASTER_CONFIG }}
            ${{ github.workspace }}\craft-clone
            ${{ github.workspace }}\${{ env.CRAFT_TARGET }}
          key: ${{ runner.os }}-sigmagrid-craft-v1-${{ env.CRAFT_TARGET }}-python-${{ env.PYTHON_VERSION }}-${{ steps.craft-revisions.outputs.key }}

      - name: Install Craft and Nextcloud dependencies
        if: steps.craft-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & cmd /C "git clone -q --depth=1 https://invent.kde.org/packaging/craftmaster.git ${{ env.CRAFT_MASTER_LOCATION }} 2>&1"

          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" `
                  --config "${{ env.CRAFT_MASTER_CONFIG }}" `
                  --target ${{ env.CRAFT_TARGET }} `
                  -c $args

              if($LASTEXITCODE -ne 0) {
                  exit $LASTEXITCODE
              }
          }

          craft --add-blueprint-repository `
              "https://github.com/nextcloud/craft-blueprints-kde.git|${{ steps.craft-revisions.outputs.kde_ref }}|"

          craft --add-blueprint-repository `
              "https://github.com/nextcloud/craft-blueprints-nextcloud.git|${{ steps.craft-revisions.outputs.nextcloud_ref }}|"

          craft craft
          craft --install-deps nextcloud-client

      - name: Save Craft dependencies
        if: steps.craft-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.CRAFT_MASTER_LOCATION }}
            ${{ env.CRAFT_MASTER_CONFIG }}
            ${{ github.workspace }}\craft-clone
            ${{ github.workspace }}\${{ env.CRAFT_TARGET }}
          key: ${{ runner.os }}-sigmagrid-craft-v1-${{ env.CRAFT_TARGET }}-python-${{ env.PYTHON_VERSION }}-${{ steps.craft-revisions.outputs.key }}

      # ------------------------------------------------------------
      # BUILD TOOLS
      # ------------------------------------------------------------

      - name: Install Inkscape
        shell: pwsh
        run: |
          choco install inkscape -y

      - name: Setup PATH
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # ------------------------------------------------------------
      # COMPILE SIGMA GRID CLOUD
      # ------------------------------------------------------------

      - name: Compile Sigma Grid Cloud
        shell: pwsh
        run: |
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" `
                  --config "${{ env.CRAFT_MASTER_CONFIG }}" `
                  --target ${{ env.CRAFT_TARGET }} `
                  -c $args

              if($LASTEXITCODE -ne 0) {
                  exit $LASTEXITCODE
              }
          }

          craft --src-dir "${{ github.workspace }}" nextcloud-client

      # ------------------------------------------------------------
      # PATCH CRAFT BLUEPRINT
      # ------------------------------------------------------------

      - name: Patch Craft for Sigma Grid Cloud packaging
        shell: pwsh
        run: |
          $blueprint = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\etc\blueprints\locations\craft-blueprints-nextcloud\nextcloud-client\nextcloud-client.py"

          if (!(Test-Path $blueprint)) {
              throw "Nextcloud Craft blueprint not found: $blueprint"
          }

          $content = Get-Content $blueprint -Raw

          # Upstream blueprint uses os.path but currently does not import os.
          if ($content -notmatch '(?m)^import os\s*$') {
              $content = $content -replace `
                  'import info', `
                  "import os`r`nimport info"
          }

          # Sigma Grid Cloud branding.
          $content = $content.Replace(
              'self.description = "Nextcloud Desktop Client"',
              'self.description = "Sigma Grid Cloud Desktop Client"'
          )

          $content = $content.Replace(
              'self.displayName = "Nextcloud"',
              'self.displayName = "Sigma Grid Cloud"'
          )

          $content = $content.Replace(
              'self.webpage = "https://nextcloud.com"',
              'self.webpage = "https://sigmagrid.hr"'
          )

          $content = $content.Replace(
              'self.defines["appname"] = "nextcloud"',
              'self.defines["appname"] = "sigmagridcloud"'
          )

          $content = $content.Replace(
              'self.defines["company"] = "Nextcloud GmbH"',
              'self.defines["company"] = "Sigma Grid"'
          )

          $content = $content.Replace(
              'self.applicationExecutable = "nextcloud"',
              'self.applicationExecutable = "sigmagridcloud"'
          )

          Set-Content -Path $blueprint -Value $content -Encoding UTF8

          Write-Host "Craft blueprint patched for Sigma Grid Cloud."

      # ------------------------------------------------------------
      # PATCH THE ACTUAL CAUSE OF THE MISSING EXE FILES
      # ------------------------------------------------------------

      - name: Patch Nextcloud package blacklist
        shell: pwsh
        run: |
          $blacklist = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\etc\blueprints\locations\craft-blueprints-nextcloud\nextcloud-client\blacklist.txt"

          if (!(Test-Path $blacklist)) {
              throw "Nextcloud blacklist not found: $blacklist"
          }

          Write-Host "Original executable blacklist rule:"

          Select-String `
              -Path $blacklist `
              -Pattern 'strip most executables|bin/\(' `
              -Context 0,1

          $content = Get-Content $blacklist -Raw

          $old = 'bin/(?!(nextcloud|nextcloudcmd|QtWebEngineProcess)).*\.exe'
          $new = 'bin/(?!(nextcloud|nextcloudcmd|sigmagridcloud|sigmagridcloudcmd|QtWebEngineProcess)).*\.exe'

          if (!$content.Contains($old)) {
              throw "Expected Nextcloud executable blacklist rule was not found. Packaging rules may have changed."
          }

          $content = $content.Replace($old, $new)

          Set-Content `
              -Path $blacklist `
              -Value $content `
              -Encoding UTF8

          Write-Host ""
          Write-Host "Patched executable blacklist rule:"

          Select-String `
              -Path $blacklist `
              -Pattern 'sigmagridcloud'

      # ------------------------------------------------------------
      # VERIFY COMPILED EXECUTABLES BEFORE PACKAGING
      # ------------------------------------------------------------

      - name: Verify Sigma Grid Cloud executables
        shell: pwsh
        run: |
          $imageBin = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\build\nextcloud-client\image-RelWithDebInfo-master\bin"

          $mainExe = Join-Path $imageBin "sigmagridcloud.exe"
          $cmdExe  = Join-Path $imageBin "sigmagridcloudcmd.exe"

          if (!(Test-Path $mainExe)) {
              throw "sigmagridcloud.exe is missing before packaging."
          }

          if (!(Test-Path $cmdExe)) {
              throw "sigmagridcloudcmd.exe is missing before packaging."
          }

          Write-Host "Both Sigma Grid Cloud executables exist before packaging:"
          Write-Host $mainExe
          Write-Host $cmdExe

      # ------------------------------------------------------------
      # INSTALLER ICON
      # ------------------------------------------------------------

      - name: Set Sigma Grid Cloud installer icon
        shell: pwsh
        run: |
          $blueprint = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\etc\blueprints\locations\craft-blueprints-nextcloud\nextcloud-client\nextcloud-client.py"

          $icon = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\build\nextcloud-client\work\build\src\gui\SigmaGridCloud.ico"

          if (!(Test-Path $icon)) {
              throw "Sigma Grid Cloud icon not found: $icon"
          }

          $content = Get-Content $blueprint -Raw

          $old = '        self.defines["company"] = "Sigma Grid"'

          $new = '        self.defines["company"] = "Sigma Grid"' +
                 "`r`n" +
                 '        self.defines["icon"] = r"' +
                 $icon +
                 '"'

          if (!$content.Contains($old)) {
              throw "Could not find Sigma Grid company definition in blueprint."
          }

          $content = $content.Replace($old, $new)

          Set-Content `
              -Path $blueprint `
              -Value $content `
              -Encoding UTF8

          Write-Host "Installer icon set to:"
          Write-Host $icon

      # ------------------------------------------------------------
      # CREATE INSTALLER
      # ------------------------------------------------------------

      - name: Create Windows installer
        shell: pwsh
        run: |
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" `
                  --config "${{ env.CRAFT_MASTER_CONFIG }}" `
                  --target ${{ env.CRAFT_TARGET }} `
                  -c $args

              if($LASTEXITCODE -ne 0) {
                  exit $LASTEXITCODE
              }
          }

          craft --package nextcloud-client

      # ------------------------------------------------------------
      # VERIFY FINAL PACKAGE
      # ------------------------------------------------------------

      - name: Verify Sigma Grid Cloud is included in final package
        shell: pwsh
        run: |
          Write-Host "Checking generated NSIS package..."

          $nsiFiles = @(
              Get-ChildItem `
                  "${{ github.workspace }}\${{ env.CRAFT_TARGET }}" `
                  -Recurse `
                  -File `
                  -Filter "*.nsi" `
                  -ErrorAction SilentlyContinue
          )

          if ($nsiFiles.Count -eq 0) {
              throw "No generated NSIS script found."
          }

          $sigmaFound = $false

          foreach ($nsi in $nsiFiles) {

              $content = Get-Content $nsi.FullName -Raw

              if ($content -match 'bin\\sigmagridcloud\.exe') {
                  Write-Host "FOUND sigmagridcloud.exe in:"
                  Write-Host $nsi.FullName

                  $sigmaFound = $true
              }
          }

          if (!$sigmaFound) {
              throw "FINAL PACKAGE CHECK FAILED: bin\sigmagridcloud.exe is not present in the generated NSIS package."
          }

          Write-Host ""
          Write-Host "SUCCESS: Sigma Grid Cloud executable is included in the final package."

      # ------------------------------------------------------------
      # SHOW + UPLOAD INSTALLER
      # ------------------------------------------------------------

      - name: Rename Sigma Grid Cloud installer
        shell: pwsh
        run: |
          $tmp = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\tmp"

          $installer = Get-ChildItem $tmp -File -Filter "*.exe" |
              Where-Object { $_.Name -ne "SigmaGridCloud-Setup-0.1.1.exe" } |
              Select-Object -First 1

          if (!$installer) {
              throw "Generated Windows installer not found."
          }

          $newName = "SigmaGridCloud-Setup-0.1.1.exe"
          $newPath = Join-Path $tmp $newName

          Move-Item $installer.FullName $newPath -Force

          Write-Host "Installer renamed:"
          Write-Host "$newPath [$((Get-Item $newPath).Length) bytes]"

      - name: Upload Sigma Grid Cloud installer
        uses: actions/upload-artifact@v4
        with:
          name: SigmaGridCloud-Windows
          path: |
            ${{ github.workspace }}\${{ env.CRAFT_TARGET }}\tmp\*.exe
            ${{ github.workspace }}\${{ env.CRAFT_TARGET }}\tmp\*.msi
          if-no-files-found: error
          retention-days: 14
